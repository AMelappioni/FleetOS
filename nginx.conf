server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # Asset con hash nel nome: cache lunga
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /companions/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

  # SPA: ogni altra rotta serve index.html (non in cache)
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
